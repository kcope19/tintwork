<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#16171b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tintwork" />
  <meta name="format-detection" content="telephone=no" />
  <title>Tintwork — browser image editor</title>
  <link rel="icon" href="src/logo.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header id="menubar">
    <button id="menuBtn" class="mobile-only icon-btn" data-sheet="menu" aria-label="Menu" title="Menu">☰</button>
    <div class="brand"><img src="src/logo.svg" alt="" width="18" height="18" /> Tintwork</div>
    <nav id="menus"></nav>
    <div class="spacer"></div>
    <div id="docinfo" class="muted"></div>
    <button class="mobile-only icon-btn" data-cmd="undo" aria-label="Undo" title="Undo">↶</button>
    <button class="mobile-only icon-btn" data-cmd="redo" aria-label="Redo" title="Redo">↷</button>
  </header>
  <div id="optionsbar"></div>
  <main id="workspace">
    <aside id="toolbar" aria-label="Tools"></aside>
    <section id="viewport" tabindex="0">
      <canvas id="view"></canvas>
      <div id="modkeys" class="mobile-only" aria-label="Touch modifiers">
        <button data-mod="shift" title="Sticky Shift: add to selection, straight lines, constrain">⇧ Shift</button>
        <button data-mod="alt" title="Sticky Alt: subtract from selection, set clone/heal source, pick color">⌥ Alt</button>
      </div>
      <div id="dropzone" class="hidden">Drop an image or project file to open</div>
      <div id="welcome" class="hidden">
        <h1>Tintwork</h1>
        <p>Open an image, drop one here, or start from a blank canvas.</p>
        <div class="row">
          <button data-cmd="open" class="primary">Open image…</button>
          <button data-cmd="new">New canvas…</button>
          <button data-cmd="camera" class="mobile-only">Take photo…</button>
        </div>
      </div>
    </section>
    <aside id="panels">
      <section class="panel" id="colorPanel">
        <h2>Color</h2>
        <div class="colors">
          <div class="swatches">
            <input type="color" id="fgColor" value="#e8553a" title="Foreground color" />
            <input type="color" id="bgColor" value="#ffffff" title="Background color" />
          </div>
          <button id="swapColors" title="Swap colors (X)">⇄</button>
          <button id="resetColors" title="Default colors (D)">◐</button>
          <span id="colorHex" class="muted"></span>
        </div>
      </section>
      <section class="panel" id="histPanel">
        <h2>Histogram</h2>
        <canvas id="histogram" width="240" height="64"></canvas>
      </section>
      <section class="panel" id="looksPanel">
        <details id="looksDetails"><summary><h2>Looks</h2></summary>
        <div id="looksGrid" class="looks-grid"></div>
        <label class="opacity look-intensity" title="Opacity of the selected look group (or the strength new looks start at)">Intensity <input type="range" id="lookIntensity" min="0" max="100" value="100" /> <span id="lookIntensityVal">100%</span></label>
        <div class="muted look-target">Applies to: <span id="lookTarget">new looks</span></div>
        <div class="panel-actions">
          <button data-cmd="lookSave" title="Save the selected adjustment layers / look group as your own look">Save look</button>
          <button data-cmd="lookImport" title="Import looks (.json)">Import</button>
          <button data-cmd="lookExport" title="Export your looks (.json)">Export</button>
        </div>
        </details>
      </section>
      <section class="panel grow" id="layersPanel">
        <h2>Layers</h2>
        <div class="layer-props">
          <select id="blendMode" title="Blend mode"></select>
          <label class="opacity">Opacity <input type="range" id="layerOpacity" min="0" max="100" value="100" /> <span id="layerOpacityVal">100%</span></label>
        </div>
        <ul id="layerList"></ul>
        <div class="panel-actions">
          <button data-cmd="layerNew" title="New layer (Ctrl+Shift+N)">＋</button>
          <button data-cmd="layerDuplicate" title="Duplicate layer (Ctrl+J)">⧉</button>
          <button data-cmd="adjLayerMenu" title="New adjustment layer">✦</button>
          <button data-cmd="editLayer" title="Edit adjustment / text layer settings">✎</button>
          <button data-cmd="layerUp" title="Move layer up (Ctrl+])">▲</button>
          <button data-cmd="layerDown" title="Move layer down (Ctrl+[)">▼</button>
          <button data-cmd="layerMergeDown" title="Merge down (Ctrl+E)">⤓</button>
          <button data-cmd="addMask" title="Add layer mask (Layer menu has more mask commands)">◐</button>
          <button data-cmd="layerDelete" title="Delete layer">🗑</button>
        </div>
      </section>
      <section class="panel" id="historyPanel">
        <h2>History</h2>
        <ol id="historyList"></ol>
      </section>
      <section class="panel sheet-only" id="menuSheet"><h2>Menu</h2><div class="sheet-groups"></div></section>
      <section class="panel sheet-only" id="adjustSheet"><h2>Adjust &amp; filter</h2><div class="sheet-groups"></div></section>
    </aside>
  </main>
  <footer id="statusbar">
    <span id="status">Ready</span>
    <span class="spacer"></span>
    <span id="cursorPos" class="muted"></span>
    <span id="zoomLabel"></span>
  </footer>

  <nav id="mobilebar" class="mobile-only" aria-label="Mobile">
    <button id="toolsToggle" aria-label="Show or hide tools"><span>✎</span>Tools</button>
    <button data-sheet="layers"><span>▤</span>Layers</button>
    <button data-sheet="adjust"><span>◑</span>Adjust</button>
    <button data-sheet="color"><span>●</span>Color</button>
    <button data-sheet="history"><span>⟲</span>History</button>
    <button data-cmd="export"><span>⇪</span>Export</button>
  </nav>

  <div id="modal" class="hidden" role="dialog" aria-modal="true">
    <div class="dialog">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div class="dialog-actions">
        <label id="previewWrap" class="hidden"><input type="checkbox" id="modalPreview" checked /> Preview</label>
        <span class="spacer"></span>
        <button id="modalCancel">Cancel</button>
        <button id="modalOk" class="primary">OK</button>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*,.json,.tintwork" hidden />
  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden />
  <script type="module" src="src/main.js"></script>
</body>
</html>
